name: Announce release on Discord

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    # Pre-releases are not announced - the in-plugin update check ignores them too,
    # so a pre-release should not reach players from either direction.
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post the release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # ---- edit this one: where the Purchase button sends people ----
          PURCHASE_URL: https://builtbybit.com/resources/moneypouchdeluxe.49617/
          PLUGIN_NAME: MoneyPouchDeluxe
          # The release notes go in through the environment on purpose. Interpolating
          # ${{ github.event.release.body }} straight into a run: block would let anything
          # written in the notes run as shell.
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: python3 .github/scripts/discord-release.py
