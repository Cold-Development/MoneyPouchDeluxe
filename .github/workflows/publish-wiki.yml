name: Publish Wiki
on:
  push:
    branches: [master]
    paths: ['wiki/**']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: 'Copy wiki/ to the GitHub wiki'
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
        find wiki -maxdepth 1 -name '*.md' ! -name 'README.md' -exec cp {} wiki-repo/ \;
        cd wiki-repo
        git config user.name "github-actions[bot]"
        git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --cached --quiet && echo "Wiki already up to date" && exit 0
        git commit -m "Update wiki from ${GITHUB_SHA::7}"
        git push
