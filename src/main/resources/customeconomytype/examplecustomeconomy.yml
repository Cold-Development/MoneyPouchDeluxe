# Example custom economy: a pouch full of diamonds instead of money.
#
# Every currency other than XP is a file like this one, so MoneyPouchDeluxe works with any
# plugin that has a command to give its currency, without depending on that plugin.
#
# The file name (without .yml) is the economy's id, used in pouches.yml as economytype.
#   It must be alphanumeric, without spaces, and unique. This one is "examplecustomeconomy".
#
# %player% = the player who opened the pouch, %prize% = the amount they won.
# The command runs from the console, without the leading slash.
# If the command doesn't exist (e.g. its plugin was removed), the failure is logged with the
# player and amount, and the player gets the 'reward-error' message.
transaction-prize-command: "give %player% diamond %prize%"

# Display name, shown by %economy% in prize-message and reward-error
name: "diamonds"

# Shown around the amount in the title and messages
prefix: ""
suffix: " Diamonds"
