# Pouch tiers are defined in pouches.yml

pouches:
  # Sound settings (!!!!!!! MUST change for pre-1.9 !!!!!!!)
  sound:
    enabled: true
    opensound: "BLOCK_CHEST_OPEN"       # (CHEST_OPEN  pre-1.9)
    revealsound: "BLOCK_ANVIL_LAND"     # (ANVIL_LAND  pre-1.9)
    endsound: "ENTITY_GENERIC_EXPLODE"  # (EXPLODE  pre-1.9)

  # Title settings (will not work before 1.8, timings will not work before 1.10)
  title:
    speed-in-tick: 10
    subtitle: "&7&oOpening..."
    obfuscate-colour: "&6"
    reveal-colour: "&f&l"
    prefix-colour: "&a&l"
    suffix-colour: "&a"
    obfuscate-digit-char: "#"
    obfuscate-format-char: "|"
    format:               # groups the digits e.g. $1,924,281 (also used for %prize% in prize-message)
      enabled: true
      separator: ","      # "," -> 1,924,281   "." -> 1.924.281   " " -> 1 924 281
      reveal-comma: true  # the separators are already revealed when opening

# Rather than showing each digit left-to-right, reveal it right-to-left
reverse-pouch-reveal: true

error-handling:
  # It is recommended you set the following to 'true' in a production environment
  # The plugin will log should a transaction fail for any reason, allowing you to investigate
  # and manually reward the player yourself
  # The player will be alerted and asked to tell an admin should this event occur regardless if this is disabled
  # You can change this message ('reward-error') at the bottom of the config
  log-failed-transactions: true
  # Refund the pouch to the player (if they are online) in the event a transaction failed - this is default
  # to 'false' as this results in a different prize on the second try, and it is unlikely
  # that the transaction will succeed if it had already failed. It is recommended
  # to keep this 'false' and manually investigate when errors occur.
  refund-pouch: false

# Prefix/suffix shown around the amount (in the title and in %prefix%%prize%%suffix%).
# XP is the only built-in economy. Every other currency is a file in the customeconomytype folder,
# which can set its own prefix/suffix; an entry here (economy.<file name>) is used when the file has none.
economy:
  xp:
    name: "XP"          # shown by %economy%
    prefix: ""
    suffix: " XP"

# Messages here
# 'prefix' is put in front of every message below, so it doesn't need to be repeated in each one.
# Set a message to "" to disable it.
# prize-message and reward-error: %prize% amount, %prefix%/%suffix% around it, %economy% the economy's name.
messages:
  prefix: "&8「<glyph:icons_beetroot>&8」&7» "
  full-inv: "&6%player%'s &finventory is &cfull&f. The pouch was dropped near the player."
  player-full-inv: "&fYour inventory is &cfull&f. A pouch was dropped near you. Make sure to pick it up."
  give-item: "&fYou have given &6%player%&f %item%&f."
  receive-item: "&fYou have received &6%item%&f."
  prize-message: "&fYou have received %prefix%%prize%%suffix%&f!"
  already-opening: "&fPlease wait until you open the first pouch!"
  invalid-pouch: "&fThis pouch no longer exists! &7(contact an administrator)"
  reward-error: "&fThe reward %prefix%%prize%%suffix% &fhas failed."
  no-permission: "&fYou do not have permission to open this pouch!"
  reloaded: "&fMoneyPouchDeluxe has been reloaded."
