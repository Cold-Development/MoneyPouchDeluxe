# Pouch tiers are defined in pouches.yml

# Language of the messages: the name of a file in the locale folder (en_US, ro_RO, ...)
# Every message, including the prefix, is in that file.
locale: en_US

pouches:
  # Sound settings (!!!!!!! MUST change for pre-1.9 !!!!!!!)
  sound:
    enabled: true
    opensound: "BLOCK_CHEST_OPEN"       # (CHEST_OPEN  pre-1.9)
    revealsound: "BLOCK_ANVIL_LAND"     # (ANVIL_LAND  pre-1.9)
    endsound: "ENTITY_GENERIC_EXPLODE"  # (EXPLODE  pre-1.9)

  # Title settings (will not work before 1.8, timings will not work before 1.10)
  title:
    speed-in-tick: 10
    subtitle: "&7&oOpening..."
    obfuscate-colour: "&6"
    reveal-colour: "&f&l"
    prefix-colour: "&a&l"
    suffix-colour: "&a"
    obfuscate-digit-char: "#"
    obfuscate-format-char: "|"
    format:               # groups the digits e.g. $1,924,281 (also used for %prize% in prize-message)
      enabled: true
      separator: ","      # "," -> 1,924,281   "." -> 1.924.281   " " -> 1 924 281
      reveal-comma: true  # the separators are already revealed when opening

# Rather than showing each digit left-to-right, reveal it right-to-left
reverse-pouch-reveal: true

# Sneak (shift) + right click opens the whole stack of pouches at once: each pouch draws its own
# amount and the player gets the total, with one reveal and the 'prize-message-stack' message
open-whole-stack-sneaking: true

error-handling:
  # It is recommended you set the following to 'true' in a production environment
  # The plugin will log should a transaction fail for any reason, allowing you to investigate
  # and manually reward the player yourself
  # The player will be alerted and asked to tell an admin should this event occur regardless if this is disabled
  # You can change this message ('reward-error') in the locale file
  log-failed-transactions: true
  # Refund the pouch to the player (if they are online) in the event a transaction failed - this is default
  # to 'false' as this results in a different prize on the second try, and it is unlikely
  # that the transaction will succeed if it had already failed. It is recommended
  # to keep this 'false' and manually investigate when errors occur.
  refund-pouch: false

# Every pouch opened (and given with /mp give) is written to the logs folder, one file per day
# (logs/2026-10-06.log): time, player, pouch, amount, economy and whether the payment worked.
# Written in the background, so it never slows the server down.
transaction-log:
  enabled: true
  # Log files older than this many days are deleted automatically (0 = keep them all)
  keep-days: 30

# Prefix/suffix shown around the amount (in the title and in %prefix%%prize%%suffix%).
# XP is built in. Every other currency is a file in the customeconomytype folder, which can set its
# own prefix/suffix; an entry here (economy.<file name>) is used when the file has none.
# VAULT and PlayerPoints also work without their file (when Vault / PlayerPoints is installed),
# using economy.vault / economy.playerpoints below; their file, if present, takes precedence.
economy:
  xp:
    name: "XP"          # shown by %economy%
    prefix: ""
    suffix: " XP"

# Where the player statistics are saved (pouches opened and amounts won, used by the PlaceholderAPI
# placeholders). By default a SQLite file in this folder (moneypouchdeluxe.db), nothing to set up.
mysql-settings:
  # Use a MySQL database instead of the SQLite file (e.g. to share statistics between servers)
  enabled: false
  hostname: 127.0.0.1
  port: 3306
  database-name: ''
  user-name: ''
  user-password: ''
  # Enable if your database supports SSL
  use-ssl: false
  # The number of connections to make to the database
  connection-pool-size: 3
