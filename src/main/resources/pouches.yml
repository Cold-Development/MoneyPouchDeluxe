#########################################################################################################
#    MoneyPouchDeluxe - pouches                                                                         #
#    Every pouch tier lives here, keyed by its id (used by /mp <id>).                                   #
#########################################################################################################

# Custom head textures: set item to "PLAYER_HEAD" and put the texture in texture-url. From https://minecraft-heads.com/custom-heads
# you can paste the "Value" (Base64), the texture URL (http://textures.minecraft.net/texture/...) or just the texture hash.
# If you don't want a custom head, use another item such as "CHEST" or "ENDER_CHEST" and leave "texture-url:" empty.
# You can use placeholders in the pouch's lore: %pricerange_from% and %pricerange_to%
# economytype is XP (built in) or the name of a file in the customeconomytype folder, e.g. VAULT -> customeconomytype/vault.yml

# Nexo support (requires Nexo installed):
#  - Use a Nexo custom item as the pouch with item: "nexo:<item_id>"  (e.g. item: "nexo:ruby_pouch")
#  - Show a Nexo glyph/icon in any name, lore line or message with <glyph:<glyph_id>>  (e.g. "<glyph:icons_beetroot> &6Money Pouch")

# Pouch now works with permissions. If you want permissions use permission-required: moneypouch.pouches.pouchName line below the economytype line. If you don't want permissions, delete the entire line.

moneypouch:
  name: "&8➥ &6&lMoney Pouch &6✦&7✦✦✦"
  item: "CHEST"
  texture-url: ""
  pricerange:
    from: 5000
    to: 15000
  options:
    economytype: "VAULT" # customeconomytype/vault.yml
  lore:
    - ""
    - "&7&oHow much money do you think is in here?"
    - ""
    - "       &8» &f&l%pricerange_from%&a&l$ &8- &f&l%pricerange_to%&a&l$ &8«"
    - ""

pointspouch:
  name: "&8➥ &6&lPoints Pouch &6✦&7✦✦✦"
  item: "PLAYER_HEAD"
  texture-url: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOTVmZDY3ZDU2ZmZjNTNmYjM2MGExNzg3OWQ5YjUzMzhkNzMzMmQ4ZjEyOTQ5MWE1ZTE3ZThkNmU4YWVhNmMzYSJ9fX0="
  pricerange:
    from: 5
    to: 15
  options:
    economytype: "PlayerPoints" # customeconomytype/playerpoints.yml
    permission-required: false
  lore:
    - ""
    - "&7&oHow much points do you think is in here?"
    - ""
    - "       &8» &f&l%pricerange_from%&a&l Points &8- &f&l%pricerange_to%&a&l Points &8«"
    - ""

xppouch:
  name: "&8➥ &6&lXP Pouch &6✦&7✦✦✦"
  item: "ENDER_CHEST"
  texture-url: ""
  pricerange:
    from: 10
    to: 150
  options:
    economytype: "XP"
    permission-required: moneypouch.pouches.xppouch # requires permission "moneypouch.pouches.xppouch" or you can delete the entire line if you don't want permissions
  lore:
    - ""
    - "&7&oHow much XP do you think is in here?"
    - ""
    - "       &8» &f&l%pricerange_from%&a&lXP &8- &f&l%pricerange_to%&a&lXP &8«"
    - ""
