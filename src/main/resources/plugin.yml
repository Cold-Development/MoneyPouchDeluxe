name: MoneyPouchDeluxe
version: ${version}
main: dev.padrewin.moneypouchdeluxe.MoneyPouchDeluxe
author: padrewin
website: 'https://github.com/Cold-Development/MoneyPouchDeluxe'
softdepend: [Nexo, Vault, PlayerPoints, PlaceholderAPI]
api-version: "1.16"
folia-supported: true

# Commands are registered by the plugin itself: /moneypouchdeluxe (aliases mp, cp, moneypouch, mpa, cpa).
# Their names and aliases can be changed in plugins/MoneyPouchDeluxe/commands/moneypouchdeluxe.yml

permissions:
  moneypouch.admin:
    description: Use /mp give, list, economies and reload
    default: op
  moneypouch.admin.giveall:
    description: Give a pouch to every online player with /mp give <pouch> *
    default: op
    children:
      moneypouch.admin: true
