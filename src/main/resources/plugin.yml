name: MoneyPouchDeluxe
version: ${version}
main: dev.padrewin.moneypouchdeluxe.MoneyPouchDeluxe
author: padrewin
website: 'https://github.com/Cold-Development/MoneyPouchDeluxe'
softdepend: [Nexo, Vault, PlayerPoints]
api-version: "1.16"
folia-supported: true
commands:
  moneypouch:
    description: Give pouches to players
    usage: /mp <pouch> [player|*] [amount]
    permission: moneypouch.admin
    aliases: [cp, mp]
  moneypouchadmin:
    description: Admin command for MoneyPouchDeluxe
    usage: /mpa <list|economies|reload>
    permission: moneypouch.admin
    aliases: [cpa, mpa]

permissions:
  moneypouch.admin:
    description: Use /mp and /mpa (give pouches, list, reload)
    default: op
  moneypouch.admin.giveall:
    description: Give a pouch to every online player with /mp <pouch> *
    default: op
    children:
      moneypouch.admin: true
